<div class="card-hover bg-base-100 border border-base-300 rounded-2xl p-4 sm:p-6 flex items-start gap-3 sm:gap-4">
    <div class="w-11 h-11 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center text-lg sm:text-xl shrink-0 {{ icon_bg|default:'bg-primary/10' }} {{ icon_color|default:'text-primary' }}">
        {{ icon }}
    </div>
    <div class="min-w-0">
        <p class="text-sm font-medium text-base-content/50 truncate">{{ label }}</p>
        <p class="text-3xl font-extrabold text-base-content mt-0.5 tabular-nums tracking-tight">{{ value }}</p>
        {% if subtitle %}
            <p class="text-xs text-base-content/40 mt-1">{{ subtitle }}</p>
        {% endif %}
    </div>
</div>
